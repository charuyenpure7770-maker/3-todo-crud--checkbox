          <form id="form">
            <div class="card shadow">
              <div class="card-header">
                <h3>Add Todo</h3>
              </div>
              <div class="card-body">
                <div class="form-group">
                  <label for="title">Title:-</label>
                  <input type="text" class="form-control" id="title" required/>
                </div>
                <div class="form-group">
                  <label for="description">Description:-</label>
                  <textarea
                    name=""
                    class="form-control"
                    id="description"
                    rows="3"
                    required
                  ></textarea>
                </div>
                <div class="form-group">
                  <label for="isCompleted">Is Completed:-</label>
                  <select name="" id="isCompleted" class="form-control" required>
                    <option value="" selected disabled>select</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                  </select>
                </div>
              </div>

              <div class="card-footer">
                <button type="submit" class="btn btn-sm btn-block btn-primary button" id="addBtn">
                  Add Todo
                </button>
                <button
                  type="button"
                  class="btn btn-sm btn-block btn-warning d-none  button" id="updateBtn"
                >
                  Update Todo
                </button>
              </div>
            </div>
          </form>
